    <script>
      // Gracefully prevent transient Vite dev HMR WebSocket disconnects from bubbling unhandled errors to the UI
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event && event.reason && (event.reason.message || String(event.reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          var src = (event && event.filename) || '';
          if (msg.indexOf('WebSocket') !== -1 || src.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
